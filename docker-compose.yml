version: '3.8'

services:
  # --- DATABASES ---
  mongodb:
    image: mongo:latest
    container_name: chat_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: slack_redis
    restart: always
    ports:
      - "6379:6379"

  # --- API GATEWAY ---
  gateway:
    image: nginx:alpine
    container_name: chat_gateway
    ports:
      - "8000:80"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - chat-service

  # --- MICROSERVICES ---
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: auth_service
    env_file: .env
    depends_on:
      - mongodb

  chat-service:
    build:
      context: .
      dockerfile: ./services/chat-service/Dockerfile
    container_name: chat_service
    env_file: .env
    depends_on:
      - mongodb
      - redis

  file-service:
    build:
      context: .
      dockerfile: ./services/file-service/Dockerfile
    container_name: file_service
    env_file: .env
    depends_on:
      - mongodb

  notification-service:
    build:
      context: .
      dockerfile: ./services/notification-service/Dockerfile
    container_name: notification_service
    env_file: .env
    depends_on:
      - redis

volumes:
  mongo_data: